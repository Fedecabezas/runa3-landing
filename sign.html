<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Runa3</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!--
      Primer acceso por link (AUT-31). Esta página no se publica en ningún lado:
      el gatekeeper solo la deja pasar con un código vigente en ?k= y le pone
      data-enrol en el <body> (la clase del código). Sin eso no dibuja nada.
      Los botones van a auth.runa3.fit con el código; auth lo canjea, deja la
      cookie de runa3.fit y vuelve a la app. La vuelta es fija, nunca de la URL.
      La cara es la de index.html (tema web-oscuro de la app).
    -->
    <style>
        :root {
            --surface-base: #0D0D0D;
            --surface-raised: #1A1A1A;
            --text-primary: #F5F5F5;
            --text-secondary: #A3A3A3;
            --text-tertiary: #737373;
            --accent: #C97C5D;
            --accent-hover: #E8956F;
            --accent-surface: #1F1714;
            --border-subtle: #333333;
            --border-default: #404040;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --ruido: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E");
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; background-color: var(--surface-base); }

        body {
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201, 124, 93, 0.10) 0%, rgba(13, 13, 13, 0) 70%),
                var(--surface-base);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: var(--ruido);
            pointer-events: none;
        }

        .page-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 24px 16px;
        }

        .tarjeta {
            width: 100%;
            max-width: 420px;
            background-image: var(--ruido), linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0) 100%);
            background-color: rgba(26, 26, 26, 0.6);
            border: 1px solid var(--border-subtle);
            border-left: 2px solid var(--accent);
            padding: 32px 28px;
            animation: entrada 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes entrada {
            from { opacity: 0; transform: translateY(20px); filter: blur(6px); }
            to   { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .marca { display: flex; align-items: baseline; gap: 12px; margin-bottom: 32px; }
        .marca .nombre { font-size: 26px; font-weight: 700; letter-spacing: -0.8px; }
        .marca .sub { font-family: var(--mono); font-size: 10px; letter-spacing: 4px; color: var(--text-tertiary); }

        .clase {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        h1 { font-size: 30px; font-weight: 300; letter-spacing: -0.8px; line-height: 1.15; margin-bottom: 12px; }

        .bajada { color: var(--text-secondary); font-size: 15px; font-weight: 300; line-height: 1.6; margin-bottom: 28px; }

        .acciones { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface-base);
            border: 1px solid var(--border-default);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .btn:hover { border-color: var(--accent); background: var(--accent-surface); }
        /* Logos en gris, sin los colores de las marcas (Fede, 2026-11-01) */
        .btn svg { width: 18px; height: 18px; flex: none; color: var(--text-secondary); }
        .btn .flecha { margin-left: auto; color: var(--text-tertiary); font-family: var(--mono); }

        .nota {
            margin-top: 24px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            line-height: 1.6;
        }

        [hidden] { display: none !important; }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <main class="tarjeta" id="enrol" hidden>
            <div class="marca"><span class="nombre">RUNA3</span><span class="sub">PLATFORM</span></div>
            <p class="clase" id="clase">Primer acceso</p>
            <h1 id="titulo">Tu lugar en Runa3</h1>
            <p class="bajada" id="bajada">Entrá con tu cuenta de Google o Microsoft. Es la que vas a usar siempre para volver.</p>
            <div class="acciones">
                <a class="btn" data-proveedor="google" href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
                    Continuar con Google <span class="flecha">→</span>
                </a>
                <a class="btn" data-proveedor="microsoft" href="#">
                    <svg viewBox="0 0 23 23" aria-hidden="true"><path fill="currentColor" d="M1 1h10v10H1zM12 1h10v10H12zM1 12h10v10H1zM12 12h10v10H12z"/></svg>
                    Continuar con Microsoft <span class="flecha">→</span>
                </a>
            </div>
            <p class="nota">Este link es personal y vence al usarse.</p>
        </main>
    </div>

    <script>
        (function () {
            var clase = document.body.getAttribute('data-enrol');
            var k = new URLSearchParams(location.search).get('k');
            // Sin el visto bueno del gatekeeper (o sin código) no hay nada que mostrar.
            if (!clase || !k) return;

            var AUTH = 'https://auth.runa3.fit';
            var VUELTA = 'https://app.runa3.fit/';

            if (clase === 'staff') {
                document.getElementById('clase').textContent = 'Equipo Runa3';
                document.getElementById('titulo').textContent = 'Bienvenido al equipo';
                document.getElementById('bajada').textContent = 'Entrá con la cuenta de Google o Microsoft que vas a usar para trabajar en Runa3.';
            }

            document.querySelectorAll('[data-proveedor]').forEach(function (a) {
                var u = new URL(AUTH + '/' + a.getAttribute('data-proveedor'));
                u.searchParams.set('app_id', 'runa3');
                u.searchParams.set('return', VUELTA);
                u.searchParams.set('codigo', k);
                a.href = u.toString();
            });

            document.getElementById('enrol').hidden = false;
        })();
    </script>
</body>

</html>
