<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Runa3</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!--
      Primer acceso por link (AUT-31). Esta página no se publica en ningún lado:
      el gatekeeper solo la deja pasar con un código vigente en ?k= y le pone
      data-enrol en el <body> (la clase del código). Sin eso no dibuja nada.
      Los botones abren auth.runa3.fit con el código en una ventana; auth lo canjea, deja el
      comprobante en app.runa3.fit/vuelta.html, y esta pestaña pasa a la app. La vuelta es fija.
      La cara es la de index.html (tema web-oscuro de la app).
    -->
    <style>
        :root {
            --surface-base: #0D0D0D;
            --surface-raised: #1A1A1A;
            --text-primary: #F5F5F5;
            --text-secondary: #A3A3A3;
            --text-tertiary: #737373;
            --accent: #C97C5D;
            --accent-hover: #E8956F;
            --accent-surface: #1F1714;
            --border-subtle: #333333;
            --border-default: #404040;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --ruido: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E");
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; background-color: var(--surface-base); }

        body {
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201, 124, 93, 0.10) 0%, rgba(13, 13, 13, 0) 70%),
                var(--surface-base);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: var(--ruido);
            pointer-events: none;
        }

        .page-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 24px 16px;
        }

        .tarjeta {
            position: relative;
            width: 100%;
            max-width: 420px;
            background-image: var(--ruido), linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0) 100%);
            background-color: rgba(26, 26, 26, 0.6);
            border: 1px solid rgba(51, 51, 51, 0.45);
            padding: 32px 28px;
            /* Sobre #0D0D0D una sombra suave no se ve: una corta y dura, y otra larga */
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.9), 0 10px 28px rgba(0, 0, 0, 0.85), 0 24px 64px rgba(0, 0, 0, 0.5);
            animation: entrada 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Las cuatro esquinas en cobre, sobre el borde (como el login de la app) */
        .esquina { position: absolute; width: 12px; height: 12px; border: 0 solid var(--accent); pointer-events: none; }
        .esquina.e1 { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
        .esquina.e2 { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
        .esquina.e3 { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
        .esquina.e4 { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }

        /* Un reflejo cruza la tarjeta una sola vez, al aparecer */
        .reflejo { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .reflejo::after {
            content: ""; position: absolute; top: -50%; bottom: -50%; width: 45%; left: -60%;
            background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(232,149,111,0.10) 45%, rgba(255,255,255,0.14) 50%, rgba(232,149,111,0.10) 55%, rgba(255,255,255,0) 100%);
            transform: skewX(-12deg);
            animation: reflejo 0.9s cubic-bezier(0.45, 0, 0.2, 1) 0.35s 1 forwards;
        }
        @keyframes reflejo { from { left: -60%; } to { left: 120%; } }

        @keyframes entrada {
            from { opacity: 0; transform: translateY(16px); filter: blur(6px); }
            to   { opacity: 1; transform: none; filter: none; }
        }

        .marca { display: flex; align-items: baseline; gap: 12px; margin-bottom: 32px; }
        .marca .nombre { font-size: 26px; font-weight: 700; letter-spacing: -0.8px; }
        .marca .sub { font-family: var(--mono); font-size: 10px; letter-spacing: 4px; color: var(--text-tertiary); }

        .clase {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        h1 { font-size: 30px; font-weight: 300; letter-spacing: -0.8px; line-height: 1.15; margin-bottom: 12px; }

        .bajada { color: var(--text-secondary); font-size: 15px; font-weight: 300; line-height: 1.6; margin-bottom: 28px; }

        /* A la medida del botón más largo, no de la placa. Entran de izquierda a
           derecha; acá no hay esqueleto porque no se espera nada: el gatekeeper ya
           validó el código. */
        .acciones {
            display: flex; flex-direction: column; gap: 10px;
            width: fit-content; min-width: min(280px, 100%); max-width: 100%;
            animation: botones 0.6s ease-in-out;
        }
        @keyframes botones { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
        @media (prefers-reduced-motion: reduce) { .acciones { animation: none; } }

        .btn {
            width: 100%;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface-base);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .btn:hover, .btn:focus-visible { border-color: var(--accent); background: var(--accent-surface); outline: none; }
        .btn svg { width: 24px; height: 24px; flex: none; }
        .btn .flecha { margin-left: auto; color: var(--text-tertiary); font-family: var(--mono); }

        .nota {
            margin-top: 24px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            line-height: 1.6;
        }

        [hidden] { display: none !important; }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <main class="tarjeta" id="enrol" hidden>
            <span class="reflejo" aria-hidden="true"></span>
            <span class="esquina e1" aria-hidden="true"></span><span class="esquina e2" aria-hidden="true"></span><span class="esquina e3" aria-hidden="true"></span><span class="esquina e4" aria-hidden="true"></span>
            <div class="marca"><span class="nombre">RUNA3</span><span class="sub">PLATFORM</span></div>
            <p class="clase" id="clase">Primer acceso</p>
            <h1 id="titulo">Tu lugar en Runa3</h1>
            <p class="bajada" id="bajada">Entrá con tu cuenta de Google, Microsoft o GitHub. Es la que vas a usar siempre para volver.</p>
            <div class="acciones">
                <button type="button" class="btn" data-proveedor="google">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                    Continuar con Google <span class="flecha">→</span>
                </button>
                <button type="button" class="btn" data-proveedor="microsoft">
                    <svg viewBox="0 0 23 23" aria-hidden="true"><path fill="#F35325" d="M1 1h10v10H1z"/><path fill="#81BC06" d="M12 1h10v10H12z"/><path fill="#05A6F0" d="M1 12h10v10H1z"/><path fill="#FFBA08" d="M12 12h10v10H12z"/></svg>
                    Continuar con Microsoft <span class="flecha">→</span>
                </button>
                <button type="button" class="btn" data-proveedor="github">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
                    Continuar con GitHub <span class="flecha">→</span>
                </button>
            </div>
            <p class="nota">Este link es personal y vence al usarse.</p>
        </main>
    </div>

    <script>
        (function () {
            var clase = document.body.getAttribute('data-enrol');
            var k = new URLSearchParams(location.search).get('k');
            // Sin el visto bueno del gatekeeper (o sin código) no hay nada que mostrar.
            if (!clase || !k) return;

            var AUTH = 'https://auth.runa3.fit';
            var VUELTA = 'https://app.runa3.fit/';

            if (clase === 'staff') {
                document.getElementById('clase').textContent = 'Equipo Runa3';
                document.getElementById('titulo').textContent = 'Bienvenido al equipo';
                document.getElementById('bajada').textContent = 'Entrá con la cuenta de Google, Microsoft o GitHub que vas a usar para trabajar en Runa3.';
            } else if (clase === 'profesional') {
                document.getElementById('clase').textContent = 'Profesional Runa3';
                document.getElementById('titulo').textContent = 'Bienvenido a Runa3';
                document.getElementById('bajada').textContent = 'Entrá con la cuenta de Google, Microsoft o GitHub que vas a usar para trabajar en Runa3.';
            }

            function urlDe(proveedor, vuelta) {
                var u = new URL(AUTH + '/' + proveedor);
                u.searchParams.set('app_id', 'runa3');
                u.searchParams.set('return', vuelta);
                u.searchParams.set('codigo', k);
                return u.toString();
            }

            // La ventana termina en app.runa3.fit/vuelta.html, que deja una seña en la
            // cookie del dominio: esta pestaña, en otro origen, la espera y pasa a la app.
            function esperarLaVuelta() {
                var reloj = setInterval(function () {
                    if (document.cookie.indexOf('runa3-entro=1') === -1) return;
                    clearInterval(reloj);
                    document.cookie = 'runa3-entro=; Domain=.runa3.fit; Path=/; Max-Age=0; Secure; SameSite=Lax';
                    location.replace(VUELTA);
                }, 500);
            }

            var sinVentanas = matchMedia('(pointer: coarse)').matches || matchMedia('(display-mode: standalone)').matches;

            document.querySelectorAll('[data-proveedor]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var proveedor = b.getAttribute('data-proveedor');
                    if (sinVentanas) return location.assign(urlDe(proveedor, VUELTA));
                    var ancho = 480, alto = 640;
                    var ventana = window.open(
                        urlDe(proveedor, VUELTA + 'vuelta.html'),
                        'runa3-login',
                        'popup,width=' + ancho + ',height=' + alto +
                        ',left=' + (screenX + (outerWidth - ancho) / 2) + ',top=' + (screenY + (outerHeight - alto) / 2)
                    );
                    if (!ventana) return location.assign(urlDe(proveedor, VUELTA));
                    esperarLaVuelta();
                });
            });

            document.getElementById('enrol').hidden = false;
        })();
    </script>
</body>

</html>
