<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Runa3</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!--
      Primer acceso por link (AUT-31). Esta página no se publica en ningún lado:
      el gatekeeper solo la deja pasar con un código vigente en ?k= y le pone
      data-enrol en el <body> (la clase del código). Sin eso no dibuja nada.
      Los botones van a auth.runa3.fit con el código; auth lo canjea, deja la
      cookie de runa3.fit y vuelve a la app. La vuelta es fija, nunca de la URL.
    -->
    <style>
        :root {
            --bg: #050505;
            --text-main: #f5f5f7;
            --text-dim: #86868b;
            --accent: #58a6ff;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; background-color: var(--bg); }

        body {
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px 16px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: entrada 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes entrada {
            from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
            to   { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .logo {
            font-size: 20px;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 40px;
            color: var(--accent);
        }

        h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 12px; }

        .tagline { color: var(--text-dim); font-size: 16px; font-weight: 300; line-height: 1.6; margin-bottom: 36px; }

        .acciones { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 24px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            font: 600 16px/1 inherit;
            font-family: inherit;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover { background: rgba(255, 255, 255, 0.06); transform: scale(1.02); }

        .btn svg { width: 20px; height: 20px; flex: none; }

        .nota { margin-top: 28px; color: var(--text-dim); font-size: 13px; font-weight: 300; line-height: 1.6; }

        [hidden] { display: none !important; }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <main class="container" id="enrol" hidden>
            <div class="logo">RUNA3</div>
            <h1 id="titulo">Tu primer acceso</h1>
            <p class="tagline" id="bajada">Entrá con tu cuenta. La vas a usar siempre para volver.</p>
            <div class="acciones">
                <a class="btn" data-proveedor="google" href="#">
                    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                    Continuar con Google
                </a>
                <a class="btn" data-proveedor="microsoft" href="#">
                    <svg viewBox="0 0 23 23" aria-hidden="true"><path fill="#F35325" d="M1 1h10v10H1z"/><path fill="#81BC06" d="M12 1h10v10H12z"/><path fill="#05A6F0" d="M1 12h10v10H1z"/><path fill="#FFBA08" d="M12 12h10v10H12z"/></svg>
                    Continuar con Microsoft
                </a>
            </div>
            <p class="nota">Este link es personal y se usa una sola vez.</p>
        </main>
    </div>

    <script>
        (function () {
            var clase = document.body.getAttribute('data-enrol');
            var k = new URLSearchParams(location.search).get('k');
            // Sin el visto bueno del gatekeeper (o sin código) no hay nada que mostrar.
            if (!clase || !k) return;

            var AUTH = 'https://auth.runa3.fit';
            var VUELTA = 'https://app.runa3.fit/';

            if (clase === 'staff') {
                document.getElementById('titulo').textContent = 'Bienvenido al equipo';
                document.getElementById('bajada').textContent = 'Entrá con la cuenta que vas a usar para trabajar en Runa3.';
            }

            document.querySelectorAll('[data-proveedor]').forEach(function (a) {
                var u = new URL(AUTH + '/' + a.getAttribute('data-proveedor'));
                u.searchParams.set('app_id', 'runa3');
                u.searchParams.set('return', VUELTA);
                u.searchParams.set('codigo', k);
                a.href = u.toString();
            });

            document.getElementById('enrol').hidden = false;
        })();
    </script>
</body>

</html>
